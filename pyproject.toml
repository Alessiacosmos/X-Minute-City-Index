[project]
name = "xmin-core"
version = "0.1.0"
description = "A repository for xmin city accessibility calculation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.94",
    "branca~=0.8.2",
    "dotenv~=0.9.9",
    "folium~=0.20.0",
    "geoalchemy2~=0.18.1",
    "geopandas~=1.1.1",
    "h3~=4.3.1",
    "ipython~=9.7.0",
    "matplotlib~=3.10.7",
    "numpy~=2.3.5",
    "openrouteservice>=2.3.3",
    "osmnx~=2.0.6",
    "pandas~=2.3.3",
    "psycopg2>=2.9.11",
    "pydantic-settings>=2.14.0",
    "pyproj~=3.7.2",
    "python-dotenv~=1.2.1",
    "rasterio>=1.5.0",
    "rasterstats>=0.20.0",
    "requests~=2.32.5",
    "requests-ratelimiter>=0.10.0",
    "shapely~=2.1.2",
    "sqlalchemy~=2.0.44",
    "tqdm~=4.67.1",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
